<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="豊田高専 情報工学科のWebシラバスから、目標評価に必要な定期試験の点数を計算します。" />
    <title>高専シラバス 評価プランナー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">Σ</span>
        <span><strong>Grade Planner</strong><small>KOSEN SYLLABUS TOOL</small></span>
      </a>
      <a class="source-link" id="source-link" href="https://syllabus.kosen-k.go.jp/" target="_blank" rel="noreferrer">公式シラバス ↗</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">2026 · 豊田高専 情報工学科</p>
          <h1>あと何点で、<br /><span>A評価に届く？</span></h1>
          <p class="hero-lead">シラバスの評価割合をもとに、残りの定期試験で必要な点数をすばやく逆算します。</p>
        </div>
        <div class="hero-orbit" aria-hidden="true">
          <div class="score-disc"><strong>80</strong><span>A LINE</span></div>
          <div class="orbit-label orbit-label-one">課題 35%</div>
          <div class="orbit-label orbit-label-two">試験 65%</div>
        </div>
      </section>

      <section class="catalog-section" aria-labelledby="catalog-title">
        <div class="section-heading">
          <div><p class="eyebrow">SUBJECTS</p><h2 id="catalog-title">科目を選ぶ</h2></div>
          <p id="data-status" class="data-status" aria-live="polite">シラバスを読み込み中…</p>
        </div>

        <div class="toolbar">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <span class="sr-only">科目名・教員名・科目番号で検索</span>
            <input id="search" type="search" placeholder="科目名・教員名・科目番号で検索" autocomplete="off" />
          </label>
          <select id="grade-filter" aria-label="対象学年で絞り込み">
            <option value="">全学年</option>
            <option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="4">4年</option><option value="5">5年</option>
          </select>
          <select id="exam-filter" aria-label="試験の有無で絞り込み">
            <option value="">すべての評価方式</option>
            <option value="exam">試験あり</option>
            <option value="no-exam">試験なし</option>
          </select>
        </div>

        <div id="subjects" class="subject-grid" aria-live="polite"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span>⌕</span><h3>該当する科目がありません</h3><p>検索条件を変えてみてください。</p>
        </div>
      </section>
    </main>

    <footer><p>非公式ツールです。最終的な評価方法は担当教員と公式シラバスを確認してください。</p></footer>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
