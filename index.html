<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="豊田高専 情報工学科のWebシラバスから、目標評価に必要な定期試験の点数を計算します。" />
    <title>高専シラバス 評価プランナー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">Σ</span>
        <span><strong>Grade Planner</strong><small>KOSEN SYLLABUS TOOL</small></span>
      </a>
      <a class="source-link" id="source-link" href="https://syllabus.kosen-k.go.jp/" target="_blank" rel="noreferrer">公式シラバス ↗</a>
    </header>

    <main class="catalog-main">
      <section class="catalog-page" aria-labelledby="catalog-title">
        <div class="catalog-intro">
          <div>
            <p class="eyebrow">2026 · 豊田高専 情報工学科</p>
            <h1 id="catalog-title">科目一覧</h1>
            <p>単位・履修区分・評価割合を比較して、科目を選ぶと必要な試験得点を計算できます。</p>
          </div>
          <div class="catalog-summary">
            <strong id="total-count">144</strong><span>登録科目</span>
            <small id="scrape-status">シラバス取得日を確認中</small>
          </div>
        </div>

        <div class="toolbar catalog-toolbar">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <span class="sr-only">科目名・教員名・科目番号で検索</span>
            <input id="search" type="search" placeholder="科目名・教員名・科目番号で検索" autocomplete="off" />
          </label>
          <div id="grade-filter" class="grade-tabs" aria-label="対象学年で絞り込み">
            <button type="button" class="is-active" data-grade="">全学年</button>
            <button type="button" data-grade="1">1年</button><button type="button" data-grade="2">2年</button><button type="button" data-grade="3">3年</button><button type="button" data-grade="4">4年</button><button type="button" data-grade="5">5年</button>
          </div>
          <select id="term-filter" aria-label="学期で絞り込み">
            <option value="">全学期</option>
          </select>
          <select id="requirement-filter" aria-label="履修区分で絞り込み">
            <option value="">全履修区分</option>
            <option value="required">必修</option>
            <option value="must-take">必履修</option>
            <option value="elective">選択</option>
          </select>
          <select id="exam-filter" aria-label="試験の有無で絞り込み">
            <option value="">すべての評価方式</option>
            <option value="exam">試験あり</option>
            <option value="no-exam">試験なし</option>
          </select>
        </div>

        <div class="list-summary">
          <p id="data-status" class="data-status" aria-live="polite">シラバスを読み込み中…</p>
          <p><span class="legend-dot required-dot"></span>必修 <span class="legend-dot must-dot"></span>必履修</p>
        </div>
        <div class="course-table-head" aria-hidden="true">
          <span>科目 / 担当教員</span><span>学年</span><span>学期</span><span>単位</span><span>科目区分</span><span>履修</span><span>評価割合</span><span></span>
        </div>
        <div id="subjects" class="course-list" aria-live="polite"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span>⌕</span><h3>該当する科目がありません</h3><p>検索条件を変えてみてください。</p>
        </div>
      </section>
    </main>

    <footer><p>非公式ツールです。最終的な評価方法は担当教員と公式シラバスを確認してください。</p></footer>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
